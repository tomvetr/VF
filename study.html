<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HEXIAN Market — Online Supermarket</title>
<style>
  :root{
    --brand:#1456d8; --brand-d:#0e41a8; --brand-l:#e8f0ff;
    --green:#12924a; --green-d:#0c7038; --green-l:#e6f6ec;
    --price:#e23a2e; --ink:#1b1f27; --mut:#6b7280; --line:#e7e9ee;
    --bg:#f3f4f7; --card:#ffffff; --warn:#fff6dd;
    --r:12px; --shadow:0 1px 2px rgba(20,28,45,.06),0 4px 14px rgba(20,28,45,.05);
  }
  html.vg{ --brand:var(--green); --brand-d:var(--green-d); --brand-l:var(--green-l); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px;}
  svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- top strip + header ---------- */
  .strip{background:var(--brand-d);color:#fff;font-size:12px;transition:background .3s;}
  .strip .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:6px;padding-bottom:6px;}
  .strip span{opacity:.92;white-space:nowrap;}
  .hdr{background:#fff;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 var(--line);}
  .hrow{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px;}
  .logo{display:flex;align-items:center;gap:9px;flex:none;}
  .logo .mark{width:38px;height:38px;border-radius:11px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .3s;}
  .logo .mark svg{width:23px;height:23px;}
  .logo b{font-size:21px;letter-spacing:.5px;display:block;line-height:1.05;}
  .logo small{font-size:9.5px;letter-spacing:1.6px;color:var(--mut);display:block;}
  .loc{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mut);flex:none;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .loc svg{width:15px;height:15px;color:var(--brand);}
  .search{flex:1;display:flex;min-width:0;border:2px solid var(--brand);border-radius:10px;overflow:hidden;transition:border-color .3s;background:#fff;}
  .search input{flex:1;min-width:0;border:0;outline:0;padding:9px 12px;font:inherit;background:transparent;color:var(--ink);}
  .search button{background:var(--brand);color:#fff;padding:0 18px;font-weight:700;display:flex;align-items:center;gap:6px;transition:background .3s;}
  .vegan{display:flex;align-items:center;gap:8px;flex:none;border:2px solid var(--green);border-radius:999px;padding:6px 8px 6px 12px;
    color:var(--green-d);font-weight:800;background:#fff;transition:.25s;}
  .vegan .sw{width:38px;height:22px;border-radius:999px;background:#cfd4dc;position:relative;transition:background .25s;flex:none;}
  .vegan .sw:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .25s;}
  html.vg .vegan{background:var(--green);color:#fff;}
  html.vg .vegan .sw{background:rgba(255,255,255,.35);}
  html.vg .vegan .sw:after{left:18px;}
  .hact{display:flex;align-items:center;gap:6px;flex:none;}
  .hbtn{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;font-size:13px;color:#3b4250;}
  .hbtn:hover{background:var(--bg);}
  .cartbtn{background:var(--brand-l);color:var(--brand-d);font-weight:800;padding:9px 14px;border-radius:10px;display:flex;align-items:center;gap:8px;transition:.3s;position:relative;}
  .cartbtn .cnt{background:var(--price);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .deptbar{background:var(--brand);transition:background .3s;}
  .deptbar .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  .deptbar .wrap::-webkit-scrollbar{display:none;}
  .deptbar a{color:#fff;padding:10px 13px;font-weight:600;white-space:nowrap;font-size:13.5px;border-bottom:3px solid transparent;opacity:.93;}
  .deptbar a:hover{background:rgba(255,255,255,.12);}
  .deptbar a.on{border-bottom-color:#fff;opacity:1;background:rgba(255,255,255,.14);}
  .vnote{background:var(--green-l);color:var(--green-d);font-weight:600;font-size:13px;display:none;border-bottom:1px solid #cfe9d9;}
  html.vg .vnote{display:block;}
  .vnote .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px;}
  .vnote button{margin-left:auto;text-decoration:underline;font-weight:700;white-space:nowrap;}

  /* ---------- generic ---------- */
  main{min-height:60vh;padding:16px 0 40px;}
  .sec{margin-top:22px;}
  .sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
  .sechead h2{font-size:19px;margin:0;}
  .sechead .sub{color:var(--mut);font-size:12.5px;}
  .sechead a{margin-left:auto;color:var(--brand);font-weight:700;font-size:13px;white-space:nowrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px;}
  .rowgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;}
  .hscroll .card{flex:0 0 186px;scroll-snap-align:start;}

  /* ---------- product card ---------- */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;min-width:0;}
  .thumb{height:150px;background:hsl(var(--h),62%,95%);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
  .thumb .em{font-size:66px;line-height:1;filter:drop-shadow(0 4px 5px rgba(0,0,0,.14));}
  .pack{width:92px;height:112px;background:#fff;border-radius:9px 9px 12px 12px;box-shadow:0 6px 14px rgba(20,28,45,.16);display:flex;flex-direction:column;align-items:center;overflow:hidden;}
  .pack i{display:block;width:100%;background:hsl(var(--h),58%,42%);color:#fff;font-style:normal;font-size:9.5px;font-weight:800;text-align:center;padding:3px 2px;white-space:nowrap;overflow:hidden;letter-spacing:.3px;}
  .pack .em{font-size:44px;margin:auto 0 0;filter:none;}
  .pack u{text-decoration:none;font-size:9px;color:#8a909c;margin:4px 0 6px;font-weight:700;}
  #loginBtn{display:none;}
  .langsel{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:#fff;color:var(--ink);cursor:pointer;}
  html.nofilter .vegan,html.nofilter .mveg{display:none !important;}
  .vtag{display:table;margin-top:12px;font-size:30px;font-weight:800;color:var(--green-d);background:var(--green-l);border:2px solid #9fd5b3;border-radius:10px;padding:2px 16px;line-height:1.3;}
  .cname,.pinfo h2,.line b,.pinfo dd,.cspec,.pinfo .meta,.line .ln span{unicode-bidi:plaintext;text-align:start;}
  html[dir=rtl] .price,html[dir=rtl] .lp{direction:ltr;unicode-bidi:isolate;}
  html[dir=rtl] .pinfo h2{padding-right:0;padding-left:30px;}
  .taskbar{display:none;background:#fff8e1;border-bottom:1px solid #f2e2b3;}
  .taskbar.show{display:block;}
  .tb{display:flex;flex-direction:column;gap:6px;padding-top:9px;padding-bottom:9px;font-size:13.5px;}
  .tb .tb1{line-height:1.4;color:#5b4300;}
  .tb .tb1 .tbs{background:#7a5600;color:#fff;border-radius:6px;padding:1px 8px;margin-inline-end:6px;font-weight:800;white-space:nowrap;}
  .tb .tb2{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;}
  .tb .tbl{font-weight:800;color:#7a5600;}
  .tb .ti{background:#fff;border:1px solid #ecd9a3;border-radius:999px;padding:3px 11px;font-weight:600;}
  .tb .ti b,.sbox li b{color:var(--green-d);}
  .tb .ti.ok{background:var(--green-l);border-color:#b7e1c6;color:var(--green-d);}
  .tb .tbf{margin-inline-start:auto;background:var(--brand);color:#fff;font-weight:800;border-radius:999px;padding:7px 16px;transition:background .3s;}
  .study{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,20,32,.55);z-index:80;display:flex;overflow-y:auto;padding:16px;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s;}
  .study.show{opacity:1;visibility:visible;transition:opacity .28s ease,visibility 0s;}
  .sbox{background:#fff;border-radius:18px;max-width:560px;width:100%;margin:auto;padding:26px 26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .sbox h2{margin:0 0 12px;font-size:22px;}
  .sbox p{margin:0 0 10px;font-size:15px;line-height:1.55;}
  .sbox .ver{background:var(--brand-l);border-radius:12px;padding:12px 14px;font-weight:600;margin:12px 0;}
  .sbox ul{margin:6px 0 14px;padding-inline-start:22px;font-size:16px;font-weight:700;}
  .sbox .lang{display:flex;justify-content:flex-end;margin:-8px 0 6px;}
  .sbox .q{margin:16px 0 4px;font-weight:700;font-size:15px;}
  .scale{display:flex;gap:6px;margin-top:8px;}
  .scale button{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 0;font-weight:800;font-size:15px;background:#fff;}
  .scale button.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .scl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px;}
  .sbox .row2{display:flex;gap:10px;margin-top:14px;}
  .sbox .row2 .cta{margin:0;}
  .sbox .cta:disabled{background:#c5cad3;}
  .tb .tb1 .tbs{background:#7a5600;}
  .tb{gap:7px;}
  .tb .tb2{gap:6px 14px;}
  .finbtn{display:none;background:var(--brand);color:#fff;font-weight:800;border-radius:10px;padding:9px 14px;white-space:nowrap;transition:background .3s;}
  html.intask .finbtn{display:inline-flex;align-items:center;gap:6px;}
  #finishS{display:none;}
  html.intask .botbar .finm{display:none;}
  .botbar{position:fixed;bottom:12px;inset-inline-end:12px;z-index:85;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(20,28,45,.15);}
  .botbar .wrap{display:flex;align-items:center;gap:6px;padding:6px 8px;max-width:none;}
  .botbar .langsel{padding:5px 6px;}
  .restart{display:none;font-weight:600;white-space:nowrap;}
  html.instudy .restart{display:flex;}
  body{padding-bottom:64px;}
  @media (max-width:760px){
    html.intask .finbtn{padding:7px 10px;font-size:13px;}
    html.intask .botbar .finm{display:inline-flex;padding:6px 12px;font-size:13px;}
    .botbar{bottom:64px;inset-inline-end:8px;}
    body{padding-bottom:116px;}
    .toast{bottom:120px;}
  }
  .toast.err,.toast.warn{display:flex;align-items:flex-start;gap:12px;text-align:start;pointer-events:auto;background:#c62828;font-size:14.5px;padding:12px 18px;max-width:min(520px,92%);top:50%;bottom:auto;transform:translate(-50%,-50%);z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .toast.err.show{transform:translate(-50%,-50%);}
  .toast.warn{background:#8a5a00;top:118px;transform:translate(-50%,0);}
  .toast.warn.show{transform:translate(-50%,0);}
  .toast .tx{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:13px;line-height:24px;text-align:center;margin:-3px -6px 0 0;}
  html[dir=rtl] .toast .tx{margin:-3px 0 0 -6px;}
  .toast .tx:hover{background:rgba(255,255,255,.38);}
  .tb2.flash{animation:listflash 1.5s ease-out;border-radius:10px;}
  @keyframes listflash{0%,60%{box-shadow:0 0 0 4px #f59e0b,0 0 18px 6px rgba(245,158,11,.6);background:#fff3c4;}100%{box-shadow:0 0 0 0 rgba(245,158,11,0);background:transparent;}}
  @media (max-width:760px){.toast.warn{top:auto;bottom:130px;} .toast.err,.toast.warn{width:92%;}}
  #deptbar a[data-k=plant]{background:var(--green);color:#fff;opacity:1;font-weight:800;border-radius:8px 8px 0 0;}
  #deptbar a[data-k=plant].on{background:var(--green-d);border-bottom-color:#fff;}
  .depts a[href="#/c/plant"] i{background:var(--green);}
  .depts a[href="#/c/plant"]{color:var(--green-d);font-weight:800;}
  .side>a[href="#/c/plant"],.side>a[href="#/c/plant"].on,.side>a[href="#/c/plant"].cur{background:var(--green);color:#fff;font-weight:800;}
  .side>a[href="#/c/plant"] span{color:#e6f6ec;}
  .sheet a[href="#/c/plant"]{background:var(--green);color:#fff;}
  .sheet a[href="#/c/plant"] span{color:#e6f6ec;}
  .study .sbox{transform:translateY(10px) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.3,1);}
  .study.show .sbox{transform:none;}
  .study .sbox.swap{animation:sswap .26s ease;}
  @keyframes sswap{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  #app{transition:opacity .2s ease;}
  .tb .ti{cursor:pointer;font:inherit;font-weight:600;color:inherit;}
  .tb .ti:hover{border-color:#d9b75c;background:#fffdf3;}
  .tb .ti.ok:hover{background:var(--green-l);}
  .tb2.intro{animation:listintro 2.5s ease-out;border-radius:10px;}
  .tb2.intro .ti{animation:pillpop 2.5s ease-out;}
  .tb2.intro .ti:nth-of-type(2){animation-delay:.12s;} .tb2.intro .ti:nth-of-type(3){animation-delay:.24s;} .tb2.intro .ti:nth-of-type(4){animation-delay:.36s;}
  @keyframes listintro{0%{box-shadow:0 0 0 0 rgba(245,158,11,0);}12%,55%{box-shadow:0 0 0 4px #f59e0b,0 0 22px 8px rgba(245,158,11,.5);background:#fff3c4;}100%{box-shadow:0 0 0 0 rgba(245,158,11,0);background:transparent;}}
  @keyframes pillpop{0%,100%{transform:none;}15%{transform:scale(1.12);}30%{transform:none;}}
  .tooli{animation:toolglow 1.2s ease-in-out 2;position:relative;z-index:2;}
  @keyframes toolglow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0);transform:none;}50%{box-shadow:0 0 0 5px #f59e0b,0 0 22px 8px rgba(245,158,11,.55);transform:scale(1.06);}}
  .tbst{margin-inline-start:auto;display:inline-flex;gap:8px;white-space:nowrap;}
  .tbt,.tbm{background:#fff;border:1px solid #ecd9a3;border-radius:999px;padding:3px 11px;font-weight:600;color:#5b4300;font-variant-numeric:tabular-nums;}
  .tbm b{color:#c62828;}
  .tbm.bump{animation:mbump .6s ease;}
  @keyframes mbump{0%,100%{transform:none;}30%{transform:scale(1.18);background:#fde8e6;border-color:#f3b4ae;}}
  .tb1 .tbst{display:none;}
  @media (max-width:760px){
    html.instudy .tb{gap:5px;padding-top:6px;padding-bottom:6px;font-size:12.5px;}
    html.instudy .tb1{display:block;line-height:1.55;}
    html.instudy .tb1 .tbs{display:inline;}
    html.instudy .tb1 .tbx{display:inline;}
    html.instudy .tb1 .tbst{display:inline-flex;gap:4px;margin-inline-start:6px;vertical-align:baseline;white-space:nowrap;}
    html.instudy .tb1 .tbt,html.instudy .tb1 .tbm{padding:0 6px;line-height:1.5;}
    html.instudy .tb2 .tbst,html.instudy .tbll{display:none;}
    html.instudy .tbls{display:inline;}
    html.instudy .tb2 .tbl{font-size:11.5px;margin-inline-end:1px;}
    html.instudy .tb2{gap:3px;flex-wrap:wrap;}
    html.instudy .tb .ti,html.instudy .tbt,html.instudy .tbm{padding:2px 6px;font-size:11px;}
    html.instudy .tb2 .ti{letter-spacing:-.1px;}
    html.instudy .vi{gap:3px;}
    html.instudy .hrow{flex-wrap:nowrap;gap:8px;padding-top:7px;padding-bottom:7px;}
    html.instudy .logo b,html.instudy .logo small{display:none;}
    html.instudy .logo .mark{width:36px;height:36px;}
    html.instudy .hrow .search{order:0;flex:1 1 auto;}
    html.instudy .hrow .search input{padding:7px 10px;font-size:14px;}
    html.instudy .hrow .vegan{display:flex;padding:5px 6px 5px 9px;gap:6px;}
    html.instudy .hrow .vegan .vl{display:none;}
    html.instudy.nofilter .hrow .vegan{display:none !important;}
    html.instudy .mveg,html.instudy .hact{display:none !important;}
    html.instudy #deptbar a[data-k=""]{order:-2;}
    html.instudy .sheet{display:flex;flex-direction:column;}
    html.instudy .sheet h3{order:-3;}
    html.instudy .crumb{display:none;}
    html.instudy .cathead{gap:2px 8px;margin-bottom:6px;align-items:center;}
    html.instudy .cathead h1{font-size:16px;}
    html.instudy .cathead .n{font-size:12px;}
    html.instudy .hid{font-size:11px;padding:1px 7px;}
    html.instudy .chips{padding-bottom:4px;gap:6px;}
    html.instudy .chip{padding:4px 10px;font-size:12px;}
    html.instudy .tools{padding:3px 8px;margin-bottom:6px;font-size:12px;gap:6px;box-shadow:none;background:transparent;}
    html.instudy .tools select{padding:3px 6px;font-size:12px;}
    html.instudy main{padding-top:6px;}
    html.instudy .thumb{height:93px;}
    html.instudy .thumb:has(img.ph){height:93px;}
    html.instudy .cbody{padding:6px 8px 7px;gap:2px;}
    html.instudy .cname{font-size:12px;}
    html.instudy .cspec{font-size:10.5px;}
    html.instudy .price{font-size:14px;}
    html.instudy .addbtn{width:26px;height:26px;font-size:17px;}
    html.instudy .step{height:26px;}
    html.instudy .depts{padding:8px 4px;row-gap:8px;}
    html.instudy .depts a i{width:38px;height:38px;font-size:20px;}
    html.instudy .depts a{font-size:11px;gap:4px;}
    html.instudy .sechead h2{font-size:15px;}
    html.instudy .sec{margin-top:14px;}
  }
  @media (max-width:760px) and (max-height:900px){
    html.instudy .deptbar{display:none;}
  }
  .tbls{display:none;}
  body:has(#modal.show) .botbar,body:has(#cart.show) .botbar,body:has(#sheet.show) .botbar{display:none;}

  html.instudy:not(.inshop):not(.stest) .botbar{z-index:79;}
  @media (max-width:760px){html.stest:not(.inshop) .study{padding-bottom:130px;}}

  img.ph{width:100%;height:100%;object-fit:contain;display:block;background:#fff;}
  .thumb:has(img.ph){height:170px;background:#fff;}
  .pd .pimg:has(img.ph){align-items:stretch;overflow:hidden;}
  .line .li{overflow:hidden;}
  .tags{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
  .tag{font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 6px;color:#fff;background:var(--price);}
  .tag.new{background:#f59e0b;} .tag.org{background:#0f9d58;} .tag.own{background:#334155;}
  .vbadge{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;display:none;}
  html.vg .vbadge{display:block;}
  .cbody{padding:10px 11px 11px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .cname{font-size:13.5px;font-weight:600;line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer;margin:0;}
  .cspec{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:4px;gap:6px;}
  .price{color:var(--price);font-weight:800;font-size:19px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .price em{font-style:normal;font-size:12px;margin-right:1px;}
  .price small{font-size:12px;}
  .price s{color:#a0a6b1;font-weight:500;font-size:11.5px;margin-left:5px;}
  .addbtn{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .3s,transform .1s;flex:none;}
  .addbtn:active{transform:scale(.88);}
  .step{display:flex;align-items:center;border:1.5px solid var(--brand);border-radius:999px;height:30px;flex:none;}
  .step button{width:28px;height:27px;font-size:17px;color:var(--brand);font-weight:700;}
  .step b{min-width:20px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;}

  /* ---------- home ---------- */
  .hero{display:grid;grid-template-columns:2.2fr 1fr;gap:12px;}

<script>
/* =====================================================================
   禾鲜汇 HEXIAN MARKET — a realistic demo supermarket with a vegan filter.
   Single self-contained file. 1,000 fictional products are generated from
   the compact catalogue below (brands, prices and products are made up).
   Catalogue line format:

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var UNITS=[['连包','-pack'],['人份',' servings'],['半只',' half'],['枚',' pcs'],['个',' pcs'],['颗',' pcs'],['根',' pcs'],['条',' pcs'],['只',' pcs'],['片',' slices'],['块',' pcs'],['杯',' cups'],['瓶',' bottles'],['袋',' bag'],['盒',' box'],['桶',' tub'],['支',' pcs'],['卷',' rolls'],['抽',' sheets'],['包',' packs'],['双',' pair'],['把',' pc'],['粒',' pcs']];
function sizeT(s){return s;}
function pname(p){return p.b.en;}
function shown(p){return !vegan||p.v;}
function money(v){return v.toFixed(v%1?1:0);}
function priceH(p){var s=p.price.toFixed(2).split('.');return '<span class="price"><em>$</em>'+s[0]+'<small>.'+s[1]+'</small>'+(p.was?'<s>$'+money(p.was)+'</s>':'')+'</span>';}
var TOFU={T1:['#f7f0dc','#e4d8b8'],T2:['#c9a26b','#a9824c'],T3:['#f2d98a','#d9bb5c']};
function em(e){if(TOFU[e]){var c=TOFU[e];return '<svg class="em" viewBox="0 0 52 52" width="1em" height="1em" style="width:1em;height:1em"><rect x="7" y="13" width="38" height="28" rx="5" fill="'+c[0]+'" stroke="'+c[1]+'" stroke-width="2"/><circle cx="18" cy="26" r="2.2" fill="'+c[1]+'"/><circle cx="31" cy="23" r="1.8" fill="'+c[1]+'"/><circle cx="35" cy="33" r="2.4" fill="'+c[1]+'"/><circle cx="22" cy="35" r="1.8" fill="'+c[1]+'"/></svg>';}return '<span class="em">'+e+'</span>';}
function isPack(p){return p.s.pack!==undefined?p.s.pack:p.d.pack;}
function photo(p){return '<img class="ph" loading="lazy" alt="" src="'+p.b.ph+'">';}
function visual(p){return p.b.ph?photo(p):isPack(p)?'<span class="pack"><i>'+esc(lang==='zh'?p.br[0]:p.br[1])+'</i>'+em(p.b.e)+'<u>'+esc(sizeT(p.size))+'</u></span>':em(p.b.e);}
function ctl(id){var q=cart[id]||0;return q?'<span class="step"><button data-act="dec" data-id="'+id+'" aria-label="-">−</button><b>'+q+'</b><button data-act="inc" data-id="'+id+'" aria-label="+">+</button></span>':'<button class="addbtn" data-act="inc" data-id="'+id+'" aria-label="'+t('add')+'">+</button>';}
function card(p){
  var tags=(p.was?'<span class="tag">'+t('tagDeal')+'</span>':'')+(p.org?'<span class="tag org">'+t('tagOrg')+'</span>':p.isNew?'<span class="tag new">'+t('tagNew')+'</span>':p.own?'<span class="tag own">'+t('tagOwn')+'</span>':'');
  return '<article class="card"><div class="thumb" style="--h:'+p.s.hue+'" data-act="open" data-id="'+p.id+'">'+visual(p)+'<div class="tags">'+tags+'</div>'+'</div>'+
   '<div class="cbody"><h3 class="cname" data-act="open" data-id="'+p.id+'">'+esc(pname(p))+'</h3><div class="cspec">'+esc(sizeT(p.size))+'</div>'+
   '<div class="prow">'+priceH(p)+'<span data-ctl="'+p.id+'">'+ctl(p.id)+'</span></div></div></article>';
}
// with the filter off, the first vegan product appears no earlier than 6th (11th in Meat); not applied to Fruit & Veg
var LEADS={meat:10,produce:0,plant:0},LEAD=0;
var ALTRX=/veggie|vegetarian|meatless|vegan|plant[- ]based|dairy[- ]free|non[- ]dairy|tofu|tempeh|morningstar|gardein|beyond meat|lightlife|field roast|boca|quorn|tofurky|almond ?milk|soy ?milk|silk /i;
function leadNV(list,n){var a=[],b=[];list.forEach(function(p){(!p.v&&!ALTRX.test(p.b.en)&&a.length<n?a:b).push(p);});return a.concat(b);}
function byPop(a,b){return (b.pop+(b.was?400:0))-(a.pop+(a.was?400:0));}
function count(list){return list.filter(shown).length;}
function deptOf(k){for(var i=0;i<DEPTS.length;i++)if(DEPTS[i].k===k)return DEPTS[i];return null;}

/* ---------- views ---------- */
function viewHome(){
  var vis=PRODUCTS.filter(shown);
  var deals=vis.filter(function(p){return p.was;}).sort(byPop).slice(0,14);
  var h='<section><div class="depts">'+DEPTS.map(function(d){return '<a href="#/c/'+d.k+'" style="--h:'+d.hue+'"><i>'+d.e+'</i>'+L(d)+'</a>';}).join('')+'</div></section>';
  DEPTS.forEach(function(d){
    var seen={},row=leadNV(vis.filter(function(p){return inDept(p,d);}).sort(byPop),vegan||(d.k in LEADS&&!LEADS[d.k])?0:99).filter(function(p){if(seen[p.b.zh])return false;seen[p.b.zh]=1;return true;}).slice(0,6);
    if(!row.length)return;
    h+='<section class="sec"><div class="sechead"><h2>'+d.e+' '+L(d)+'</h2><span class="sub">'+t('hot')+'</span><a href="#/c/'+d.k+'">'+t('seeAll')+'</a></div><div class="rowgrid">'+row.map(card).join('')+'</div></section>';
  });
  return h;
}
function listView(all,head,chips,side){
  var list=all.filter(shown);if(onlyDeal)list=list.filter(function(p){return p.was;});
  var hid=all.length-all.filter(shown).length;
  if(sort==='asc')list.sort(function(a,b){return a.price-b.price;});
  else if(sort==='desc')list.sort(function(a,b){return b.price-a.price;});
  else if(sort==='sold')list.sort(function(a,b){return b.sold-a.sold;});
  else{list.sort(byPop);if(!vegan&&LEAD)list=leadNV(list,LEAD);}
  var h='<div class="cathead">'+head+'<span class="n">'+t('items')(list.length)+'</span>'+(vegan&&hid?'<span class="hid">🌱 '+t('hidden')(hid)+'</span>':'')+'</div>'+chips+
    '<div class="tools"><span>'+t('sort')+'</span><select id="sortSel">'+[['pop','sPop'],['asc','sAsc'],['desc','sDesc']].map(function(o){return '<option value="'+o[0]+'"'+(sort===o[0]?' selected':'')+'>'+t(o[1])+'</option>';}).join('')+'</select>'+
    '</div>';
  if(!list.length) h+='<div class="empty"><i>🔍</i><b>'+t('none')+'</b>'+(vegan?'<div>'+t('noneV')+'</div>':'')+'</div>';
  else h+='<div class="grid">'+list.slice(0,limit).map(card).join('')+'</div>'+(list.length>limit?'<button class="more" data-act="more">'+t('more')+' ('+(list.length-limit)+')</button>':'');
  return side?'<div class="cat">'+side+'<div>'+h+'</div></div>':h;
}
function viewCat(dk,sk){
  var d=deptOf(dk);if(!d)return viewHome();LEAD=(d.k in LEADS)?LEADS[d.k]:5;
  var sub=null;d.subs.forEach(function(s){if(s.k===sk)sub=s;});
  var all=PRODUCTS.filter(function(p){return inDept(p,d)&&(!sub||inSub(p,sub));});
  var cnt=function(f){return count(PRODUCTS.filter(f));};
  var chips='<div class="chips"><a class="chip'+(sub?'':' on')+'" href="#/c/'+d.k+'">'+t('all')+'</a>'+d.subs.map(function(s){return '<a class="chip'+(s===sub?' on':'')+'" href="#/c/'+d.k+'/'+s.k+'">'+L(s)+'</a>';}).join('')+'</div>';
  var side='<aside class="side"><h4>'+t('cats')+'</h4>'+DEPTS.map(function(x){
    var h='<a class="'+(x===d?(sub?'cur':'on'):'')+'" href="#/c/'+x.k+'">'+x.e+' '+L(x)+(x===d?'<span>'+cnt(function(p){return inDept(p,x);})+'</span>':'')+'</a>';
    if(x===d)h+='<div class="subl">'+x.subs.map(function(s){return '<a class="'+(s===sub?'on':'')+'" href="#/c/'+x.k+'/'+s.k+'">'+L(s)+'<span>'+cnt(function(p){return inSub(p,s);})+'</span></a>';}).join('')+'</div>';
    return h;}).join('')+'</aside>';
  var crumb='<div class="crumb"><a href="#/">'+t('home')+'</a> › '+(sub?'<a href="#/c/'+d.k+'">'+L(d)+'</a> › '+L(sub):L(d))+'</div>';
  return crumb+listView(all,'<h1>'+d.e+' '+(sub?L(sub):L(d))+'</h1>',chips,side);
}
function viewSearch(q){LEAD=5;
  var k=q.toLowerCase().trim();
  var all=PRODUCTS.filter(function(p){return p.b.en.toLowerCase().indexOf(k)>=0;});
  return '<div class="crumb"><a href="#/">'+t('home')+'</a> › '+t('search')+'</div>'+listView(all,'<h1>'+esc(t('results')(q))+'</h1>','',null);
}
function route(){
  var h=decodeURIComponent(location.hash.replace(/^#\/?/,'')),a=h.split('/');
  if(h!==lastRoute){limit=40;if(a[0]!=='c'||lastRoute.split('/')[1]!==a[1]){sort='pop';onlyDeal=false;}lastRoute=h;window.scrollTo(0,0);}
  var html=a[0]==='c'?viewCat(a[1],a[2]):a[0]==='s'&&a[1]?viewSearch(a.slice(1).join('/')):viewHome();
  $('#app').innerHTML=html;
  document.querySelectorAll('#deptbar a').forEach(function(x){x.classList.toggle('on',a[0]==='c'&&x.dataset.k===a[1]||(!a[0]||a[0]==='')&&x.dataset.k==='');});
  if(a[0]==='s')$('#q').value=a.slice(1).join('/');
}

/* ---------- chrome (header, footer, tab bar) ---------- */
function chrome(){
  document.documentElement.lang=lang;document.title=t('title');
  $('#logoName').textContent=t('logo');
  $('#q').placeholder=t('ph');$('#searchBtnT').textContent=t('search');$('#langSel').value=lang;$('#loginBtn').textContent=t('login');$('#cartBtnT').textContent=t('cart');

  $('#vnoteT').textContent=t('vnote')(PRODUCTS.length-NVEG);$('#vnoteOff').textContent=t('vnoteOff');
  var I={home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',cats:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L23 7H6"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
  $('#tabbar').innerHTML=[['home','gohome'],['cats','sheet'],['cart','cart']].map(function(x){return '<button data-act="'+x[1]+'"'+(x[0]==='home'?' class="on"':'')+'><svg class="ic" viewBox="0 0 24 24">'+I[x[0]]+'</svg>'+t(x[0])+(x[0]==='cart'?'<span class="cnt" data-cnt>0</span>':'')+'</button>';}).join('');
  badge();
}
function badge(){var n=0;for(var k in cart)n+=cart[k];document.querySelectorAll('[data-cnt]').forEach(function(x){x.textContent=n;x.style.display=n?'':'none';});}
var toastT;function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('show');},1700);}
function save(){try{localStorage.setItem('os_cart',JSON.stringify(cart));}catch(e){}}

/* ---------- cart ---------- */
function setQty(id,q){if(q<=0)delete cart[id];else cart[id]=q;save();badge();
  document.querySelectorAll('[data-ctl="'+id+'"]').forEach(function(x){x.innerHTML=ctl(id);});
  if($('#cart').classList.contains('show'))renderCart();}
function totals(){var sub=0,n=0;for(var k in cart){sub+=PRODUCTS[k].price*cart[k];n+=cart[k];}var ship=0;return {sub:sub,n:n,ship:ship,total:sub+ship};}
function renderCart(){
  var tt=totals(),ids=Object.keys(cart),h='<div class="dhead">🛒 '+t('cartT')+(tt.n?' ('+tt.n+')':'')+'<button data-act="closeall" aria-label="close">✕</button></div>';
  if(!ids.length){h+='<div class="dbody"><div class="empty" style="box-shadow:none"><i>🧺</i><b>'+t('cartEmpty')+'</b><div>'+t('cartEmptyS')+'</div></div></div><div class="dfoot"><button class="cta" data-act="closeall">'+t('goShop')+'</button></div>';}
  else{
    h+='<div class="dbody">'+
      ids.map(function(id){var p=PRODUCTS[id];return '<div class="line"><div class="li" style="--h:'+p.s.hue+'" data-act="open" data-id="'+id+'">'+(p.b.ph?photo(p):em(p.b.e))+'</div><div class="ln"><b>'+esc(pname(p))+'</b><span>'+esc(sizeT(p.size))+'</span>'+(vegan&&!p.v?'<span class="nv">'+t('nv')+'</span>':'')+'<span class="lp">$'+(p.price*cart[id]).toFixed(2)+'</span></div><span data-ctl="'+id+'">'+ctl(id)+'</span></div>';}).join('')+
      '</div><div class="dfoot"><div class="sum"><span>'+t('subtotal')+'</span><span>$'+tt.sub.toFixed(2)+'</span></div><div class="sum"><span>'+t('ship')+'</span><span>'+(tt.ship?'¥'+tt.ship.toFixed(2):t('free'))+'</span></div><div class="sum t"><span>'+t('total')+'</span><b>$'+tt.total.toFixed(2)+'</b></div><button class="cta" data-act="'+(STUDY?'closeall':'checkout')+'">'+(STUDY?t('back'):t('checkout'))+'</button></div>';
  }
  $('#cart').innerHTML=h;
}
function openCart(){closeAll();renderCart();$('#cart').classList.add('show');$('#ov').classList.add('show');}
function closeAll(){['#cart','#modal','#sheet','#ov'].forEach(function(s){$(s).classList.remove('show');});}

/* ---------- product detail ---------- */
function ingOf(p){
  var b=p.b,core=lang==='zh'?(b.ingZh||b.zh):(b.ingEn||b.en),tl=TAILS[p.d.tail];
  if(!tl||!b.ingZh)return core;
  var arr=(lang==='zh'?tl.zh:tl.en).slice(),s=p.h;for(var i=arr.length-1;i>0;i--){s=(s*9301+49297)%233280;var j=Math.floor(s/233280*(i+1));var x=arr[i];arr[i]=arr[j];arr[j]=x;}
  return core+(lang==='zh'?'、':', ')+arr.slice(0,3+p.h%4).join(lang==='zh'?'、':', ');
}
function openProduct(id){
  var p=PRODUCTS[id];
  $('#modal').innerHTML='<button class="x" data-act="closeall" aria-label="close">✕</button><div class="pd"><div class="pimg" style="--h:'+p.s.hue+'">'+visual(p)+'</div><div class="pinfo">'+
    '<div class="br">'+L(p.d)+' › '+L(p.s)+'</div><h2>'+esc(pname(p))+'</h2>'+
    '<div class="meta">'+esc(sizeT(p.size))+'</div>'+priceH(p)+
    (p.v?'<div class="vok">'+t('vok')+'</div>':'')+
    '<dl><dt>'+t('ing')+'</dt><dd>'+esc(ingOf(p))+(LABELS&&p.v?'<div class="vtag">🌱 '+t('vb')+'</div>':'')+'</dd><dt>'+t('spec')+'</dt><dd>'+esc(sizeT(p.size))+'</dd></dl>'+
    '<div class="buy"><span data-ctl="'+id+'">'+ctl(id)+'</span><button class="cta" data-act="inc" data-id="'+id+'" data-toast="1">'+t('add')+'</button></div></div></div>';
  $('#cart').classList.remove('show');$('#modal').classList.add('show');$('#ov').classList.add('show');
}
function checkout(){
  var tt=totals();
  $('#modal').innerHTML='<button class="x" data-act="closeall" aria-label="close">✕</button><div class="co"><h2>'+t('coT')+'</h2>'+
   '<div class="box"><b>'+t('addr')+'</b>'+t('addrV')+'</div><div class="box"><b>'+t('time')+'</b>'+t('timeV')+'</div>'+
   '<div class="box"><b>'+t('pay')+'</b><div class="pay"><span class="on">'+t('wx')+'</span><span>'+t('ali')+'</span><span>'+t('card')+'</span></div></div>'+
   '<div class="sum"><span>'+t('subtotal')+' ('+tt.n+')</span><span>$'+tt.sub.toFixed(2)+'</span></div><div class="sum"><span>'+t('ship')+'</span><span>'+(tt.ship?'¥'+tt.ship.toFixed(2):t('free'))+'</span></div><div class="sum t"><span>'+t('total')+'</span><b>$'+tt.total.toFixed(2)+'</b></div>'+
   '<div class="demo">'+t('demo')+'</div><button class="cta" data-act="submit">'+t('submit')+'</button></div>';
  $('#cart').classList.remove('show');$('#modal').classList.add('show');$('#ov').classList.add('show');
}
function submitOrder(){
  cart={};save();badge();
  $('#modal').innerHTML='<div class="co" style="text-align:center"><div class="okmark">✓</div><h2>'+t('okT')+'</h2><p style="color:var(--mut);margin:0 0 6px">'+t('okP')+'</p><button class="cta" data-act="closeall">'+t('back')+'</button></div>';
  route();
}
function openSheet(){
  $('#sheet').innerHTML='<h3>'+t('cats')+'</h3>'+DEPTS.map(function(d){return '<a href="#/c/'+d.k+'" data-act="closeall"><i>'+d.e+'</i>'+L(d)+'<span>'+count(PRODUCTS.filter(function(p){return inDept(p,d);}))+'</span></a>';}).join('');
  $('#sheet').classList.add('show');$('#ov').classList.add('show');
}
function setVegan(on){vegan=on;document.documentElement.classList.toggle('vg',on);chrome();route();if($('#cart').classList.contains('show'))renderCart();}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='inc'){setQty(id,(cart[id]||0)+1);if(el.dataset.toast||!cart[id]||cart[id]===1)toast(t('added')(pname(PRODUCTS[id])));}
  else if(a==='dec')setQty(id,(cart[id]||0)-1);
  else if(a==='open')openProduct(id);
  else if(a==='cart')openCart();
  else if(a==='closeall')closeAll();
  else if(a==='vegan')setVegan(!vegan);
  else if(a==='lang'){lang=lang==='zh'?'en':'zh';chrome();route();closeAll();}
  else if(a==='more'){limit+=40;route();}
  else if(a==='checkout'){if(STUDY)studyFinish();else checkout();}
  else if(a==='submit')submitOrder();
  else if(a==='sheet')openSheet();
  else if(a==='gohome'){location.hash='#/';closeAll();}
  else if(a==='demo')toast(t('demoToast'));
});
document.addEventListener('change',function(e){
  if(e.target.id==='langSel'){setLang(e.target.value);}
  if(e.target.id==='sortSel'){sort=e.target.value;route();}
  if(e.target.id==='dealChk'){onlyDeal=e.target.checked;limit=40;route();}
});
$('#searchForm').addEventListener('submit',function(e){e.preventDefault();var v=$('#q').value.trim();location.hash=v?'#/s/'+encodeURIComponent(v):'#/';$('#q').blur();});

  if(h<n){closeAll();SS.phase='confirm';studyRender();return;}
  endTask();
}
function endTask(){
  var ids=Object.keys(cart),k=VK[curVer()],o=SS.res[k]||{};
  o.list=SS.lists[SS.step]+1;o.pos=SS.step+1;
  if(TASK){o.time=Math.round((Date.now()-TASK.t0)/1000);o.clicks=TASK.clicks;o.pages=TASK.pages;o.search=TASK.searches;o.feature=TASK.feature;}
  o.items=ids.length;o.found=covered(true).length;o.nonvegan=TASK?TASK.mistakes:0;o.offlist=TASK?TASK.offlist:0;
  o.cart=ids.map(function(id){return DATA[id][0];}).join('-');
  hideErr();
  SS.res[k]=o;TASK=null;SS.phase='q';closeAll();ssave();studyRender();
}
function surveyUrl(){
  var q={pid:SS.pid,group:SS.group,alt:SS.alt,order:SS.order.map(function(v){return VK[v];}).join(''),lang:lang,total:SS.t0?Math.round(((SS.doneAt||Date.now())-SS.t0)/1000):''};
  ['c','f','a'].forEach(function(k){var o=SS.res[k]||{};['list','pos','time','clicks','pages','search','feature','items','found','nonvegan','offlist','ease','cart'].forEach(function(f){q[k+'_'+f]=o[f]===undefined?'':o[f];});});
  return SURVEY_URL+'?'+Object.keys(q).map(function(k){return k+'='+encodeURIComponent(q[k]);}).join('&');
}
document.addEventListener('click',function(e){
  if(!STUDY||!SS)return;
  if(TASK&&SS.phase==='task')TASK.clicks++;
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.dataset.act;
  if(a==='slist'){e.stopImmediatePropagation();closeAll();location.hash='#/s/'+encodeURIComponent(L(TERMS[el.dataset.k]));return;}
  if(a==='tclose'){e.stopImmediatePropagation();hideErr();return;}
  if(a==='inc'&&SS.phase==='task'&&!cart[el.dataset.id]){var pr=PRODUCTS[el.dataset.id];
    if(!onList(pr)){e.stopImmediatePropagation();e.preventDefault();if(TASK)TASK.offlist++;errToast(st('offL')(pname(pr)),'warn');flashList();return;}
    if(!pr.v){e.stopImmediatePropagation();e.preventDefault();if(TASK)TASK.mistakes++;updStats();errToast(st('notV')(pname(pr)));return;}}
  if(a==='sgo'){var to=el.dataset.to;
    if(to==='task'){if(SS.phase==='confirm'){SS.phase='task';studyRender();}else startTask();}
    else if(to==='q')endTask();
    else{SS.phase=to;ssave();studyRender();}}
  else if(a==='sfinish')studyFinish();
  else if(a==='sans'){var r=SS.res[VK[curVer()]];r[el.dataset.k]=+el.dataset.v;ssave();
    el.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===el);});var nb=document.querySelector('[data-act=snext]');if(nb)nb.disabled=!r.ease;}
  else if(a==='snext'){if(SS.step<2){SS.step++;SS.phase='brief';applyVersion(curVer());}else{SS.phase='done';SS.doneAt=Date.now();}ssave();studyRender();}
  else if(a==='sskip'){clearTimeout(AUTO);AUTO=null;TASK=null;hideErr();closeAll();var o=SS.res[VK[curVer()]]||{};o.skipped=1;SS.res[VK[curVer()]]=o;
    if(SS.step<2){SS.step++;SS.phase='brief';applyVersion(curVer());}else{SS.phase='done';SS.doneAt=Date.now();}ssave();studyRender();}
  else if(a==='srestart'){if(el.dataset.noask||confirm(st('restartQ'))){try{localStorage.removeItem('vf_study');}catch(e){}var u=new URLSearchParams(location.search);u.delete('reset');u.delete('group');var q=u.toString();location.href=location.pathname+(q?'?'+q:'')+'#/';setTimeout(function(){location.reload();},50);}}
  else if(a==='ssurvey'){(window.top||window).location.href=surveyUrl();}
},true);
if(true){
  var _op=openProduct;openProduct=function(id){if(STUDY&&TASK){TASK.pages++;if(LABELS&&PRODUCTS[id].v)TASK.feature++;}_op(id);};
  var _sv=setVegan;setVegan=function(on){if(STUDY&&TASK&&on&&curVer()==='filter')TASK.feature++;_sv(on);};
  var _sq=setQty;setQty=function(id,q){_sq(id,q);if(STUDY&&SS&&SS.phase==='task'){studyRender();if(TASK&&!TASK.allf&&covered(true).length>=curList().length){TASK.allf=1;setTimeout(function(){if(SS.phase!=='task')return;toast(st('allFound'));document.querySelectorAll('.finbtn').forEach(function(x){if(!x.offsetParent)return;x.classList.remove('tooli');void x.offsetWidth;x.classList.add('tooli');setTimeout(function(){x.classList.remove('tooli');},2600);});},700);}}};
  $('#searchForm').addEventListener('submit',function(){if(STUDY&&TASK)TASK.searches++;});
  window.addEventListener('hashchange',function(){if(STUDY&&TASK&&curVer()==='category'&&/^#\/c\/plant(\/|$)/.test(location.hash))TASK.feature++;});
}

/* ---------- translated names, ingredients and metric sizes (Chinese / Hebrew) ---------- */
function pname(p){var n=lang!=='en'&&TRD.n[lang]&&TRD.n[lang][p.oid];return n||p.b.en;}
function ingOf(p){var s=p.b.ingEn||'';var d=lang!=='en'&&TRD.i[lang];if(!d)return s;
  var out=s.split(/([,;.()\[\]{}:])/).map(function(t){if(/^[,;.()\[\]{}:]$/.test(t)){if(lang==='zh')return {',':'、',';':'；','.':'。','(':'（',')':'）','[':'【',']':'】','{':'（','}':'）',':':'：'}[t];return t;}
    var k=t.trim().toLowerCase().replace(/\s+/g,' ');if(!k)return t;var v=d[k];if(!v)return t;return (lang==='zh'?'':(/^\s/.test(t)?' ':''))+v;}).join('');
  return lang==='zh'?out.replace(/\s*([、；。（）【】：])\s*/g,'$1'):out;}
function sizeT(s){if(lang==='en'||!s)return s;
  var U=lang==='he'?{g:'גרם',kg:'ק"ג',ml:'מ"ל',l:'ליטר',pc:'יח\''}:{g:'g',kg:'kg',ml:'ml',l:'L',pc:'个'};
  var r=function(v){return (Math.round(v*10)/10).toString();};
  var fmt=function(v,u){if(u==='g'&&v>=1000)return r(v/1000)+' '+U.kg;if(u==='ml'&&v>=1000)return r(v/1000)+' '+U.l;return Math.round(v)+' '+U[u];};
  var pre='',m0=s.match(/^(\d+)\s*(?:-|x|×|ct\b)\s*(?=\d)/i);if(m0)pre=m0[1]+' × ';
  var m;
  if((m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|lt|l)\b/i))){var u=m[2].toLowerCase(),v=parseFloat(m[1]);if(u==='kg')return pre+fmt(v*1000,'g');if(u==='lt'||u==='l')return pre+fmt(v*1000,'ml');return pre+fmt(v,u);}
  if((m=s.match(/(\d+(?:\.\d+)?)\s*fl\.?\s*oz/i)))return pre+fmt(parseFloat(m[1])*29.57,'ml');
  if((m=s.match(/(\d+(?:\.\d+)?)\s*(?:gl|gal)/i)))return pre+fmt(parseFloat(m[1])*3785,'ml');
  if((m=s.match(/(\d+(?:\.\d+)?)\s*qt/i)))return pre+fmt(parseFloat(m[1])*946,'ml');
  if((m=s.match(/(\d+(?:\.\d+)?)\s*pt\b/i)))return pre+fmt(parseFloat(m[1])*473,'ml');
  if((m=s.match(/(\d+(?:\.\d+)?)\s*oz/i)))return pre+fmt(parseFloat(m[1])*28.35,'g');
  if((m=s.match(/(\d+(?:\.\d+)?)\s*lbs?\b/i)))return pre+fmt(parseFloat(m[1])*453.6,'g');
  if((m=s.match(/^(\d+)\s*(?:each|ct|count|pk|pack|bags?)\b/i)))return m[1]+' '+U.pc;
  return s;}
function viewSearch(q){LEAD=5;
  // words must all match (AND); if nothing matches, any word may match (OR)
  var k=q.toLowerCase().trim();
  var words=k.replace(/(纯素|素食)/g,' $1 ').split(/\s+/).filter(Boolean);
  var syn=function(w){var out=[w];for(var tk in TERMS){var T_=TERMS[tk];if([T_.en,T_.zh,T_.he].some(function(x){return x.toLowerCase()===w;}))out.push(T_.en);}return out;};
  var hay=function(p){return (p.b.en+' '+pname(p)).toLowerCase();};
  var has=function(p,w){var h=hay(p);return syn(w).some(function(a){return h.indexOf(a)>=0;});};
  var all=PRODUCTS.filter(function(p){return has(p,k);});
  if(!all.length&&words.length>1)all=PRODUCTS.filter(function(p){return words.every(function(w){return has(p,w);});});
  if(!all.length&&words.length>1)all=PRODUCTS.filter(function(p){return words.some(function(w){return has(p,w);});});
  // Chinese has no spaces: fall back to 2-character pieces, then single characters
  if(!all.length&&/[\u4e00-\u9fff]/.test(k)){var cj=k.replace(/[^\u4e00-\u9fff]/g,''),bi=[];for(var i=0;i<cj.length-1;i++)bi.push(cj.substr(i,2));
    all=PRODUCTS.filter(function(p){var h=hay(p);return bi.some(function(w){return h.indexOf(w)>=0;});});
    if(!all.length)all=PRODUCTS.filter(function(p){var h=hay(p);return cj.split('').some(function(c){return h.indexOf(c)>=0;});});}
  return '<div class="crumb"><a href="#/">'+t('home')+'</a> › '+t('search')+'</div>'+listView(all,'<h1>'+esc(t('results')(q))+'</h1>','',null);
}

/* ---------- timer and mistake counter in the task bar ---------- */
function STATS(){return '<span class="tbst"><span class="tbt">⏱ <b class="tbTime">'+fmtT(statT())+'</b></span><span class="tbm">'+st('mist')+': <b class="tbMist">'+statM()+'</b></span></span>';}
function curRes(){return (SS&&SS.res[VK[curVer()]])||{};}
function statT(){if(TASK)return (Date.now()-TASK.t0)/1000;var o=curRes();return SS&&SS.phase==='brief'?0:(o.time||0);}
function statM(){if(TASK)return TASK.mistakes;var o=curRes();return SS&&SS.phase==='brief'?0:(o.nonvegan||0);}
function fmtT(s){s=Math.floor(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function updStats(){var tt=fmtT(statT()),m=String(statM());document.querySelectorAll('.tbTime').forEach(function(a){a.textContent=tt;});document.querySelectorAll('.tbMist').forEach(function(b){if(b.textContent!==m){b.textContent=m;var w=b.parentNode;w.classList.remove('bump');void w.offsetWidth;w.classList.add('bump');}});}
setInterval(function(){if(STUDY&&TASK)updStats();},500);

(function(){
  var qs=new URLSearchParams(location.search);
  initLang(qs);
  if(!STUDY)try{var c=JSON.parse(localStorage.getItem('os_cart')||'{}');for(var k in c)if(PRODUCTS[k]&&c[k]>0)cart[k]=c[k];}catch(e){}
  chrome();
  if(STUDY)studyInit(qs);else if(qs.get('vegan')==='1')setVegan(true);else route();
})();
