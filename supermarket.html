<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HEXIAN Market — Online Supermarket</title>
<style>
  :root{
    --brand:#1456d8; --brand-d:#0e41a8; --brand-l:#e8f0ff;
    --green:#12924a; --green-d:#0c7038; --green-l:#e6f6ec;
    --price:#e23a2e; --ink:#1b1f27; --mut:#6b7280; --line:#e7e9ee;
    --bg:#f3f4f7; --card:#ffffff; --warn:#fff6dd;
    --r:12px; --shadow:0 1px 2px rgba(20,28,45,.06),0 4px 14px rgba(20,28,45,.05);
  }
  html.vg{ --brand:var(--green); --brand-d:var(--green-d); --brand-l:var(--green-l); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px;}
  svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- top strip + header ---------- */
  .strip{background:var(--brand-d);color:#fff;font-size:12px;transition:background .3s;}
  .strip .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:6px;padding-bottom:6px;}
  .strip span{opacity:.92;white-space:nowrap;}
  .hdr{background:#fff;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 var(--line);}
  .hrow{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px;}
  .logo{display:flex;align-items:center;gap:9px;flex:none;}
  .logo .mark{width:38px;height:38px;border-radius:11px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .3s;}
  .logo .mark svg{width:23px;height:23px;}
  .logo b{font-size:21px;letter-spacing:.5px;display:block;line-height:1.05;}
  .logo small{font-size:9.5px;letter-spacing:1.6px;color:var(--mut);display:block;}
  .loc{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mut);flex:none;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .loc svg{width:15px;height:15px;color:var(--brand);}
  .search{flex:1;display:flex;min-width:0;border:2px solid var(--brand);border-radius:10px;overflow:hidden;transition:border-color .3s;background:#fff;}
  .search input{flex:1;min-width:0;border:0;outline:0;padding:9px 12px;font:inherit;background:transparent;color:var(--ink);}
  .search button{background:var(--brand);color:#fff;padding:0 18px;font-weight:700;display:flex;align-items:center;gap:6px;transition:background .3s;}
  .vegan{display:flex;align-items:center;gap:8px;flex:none;border:2px solid var(--green);border-radius:999px;padding:6px 8px 6px 12px;
    color:var(--green-d);font-weight:800;background:#fff;transition:.25s;}
  .vegan .sw{width:38px;height:22px;border-radius:999px;background:#cfd4dc;position:relative;transition:background .25s;flex:none;}
  .vegan .sw:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .25s;}
  html.vg .vegan{background:var(--green);color:#fff;}
  html.vg .vegan .sw{background:rgba(255,255,255,.35);}
  html.vg .vegan .sw:after{left:18px;}
  .hact{display:flex;align-items:center;gap:6px;flex:none;}
  .hbtn{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;font-size:13px;color:#3b4250;}
  .hbtn:hover{background:var(--bg);}
  .cartbtn{background:var(--brand-l);color:var(--brand-d);font-weight:800;padding:9px 14px;border-radius:10px;display:flex;align-items:center;gap:8px;transition:.3s;position:relative;}
  .cartbtn .cnt{background:var(--price);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .deptbar{background:var(--brand);transition:background .3s;}
  .deptbar .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  .deptbar .wrap::-webkit-scrollbar{display:none;}
  .deptbar a{color:#fff;padding:10px 13px;font-weight:600;white-space:nowrap;font-size:13.5px;border-bottom:3px solid transparent;opacity:.93;}
  .deptbar a:hover{background:rgba(255,255,255,.12);}
  .deptbar a.on{border-bottom-color:#fff;opacity:1;background:rgba(255,255,255,.14);}
  .vnote{background:var(--green-l);color:var(--green-d);font-weight:600;font-size:13px;display:none;border-bottom:1px solid #cfe9d9;}
  html.vg .vnote{display:block;}
  .vnote .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px;}
  .vnote button{margin-left:auto;text-decoration:underline;font-weight:700;white-space:nowrap;}

  /* ---------- generic ---------- */
  main{min-height:60vh;padding:16px 0 40px;}
  .sec{margin-top:22px;}
  .sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
  .sechead h2{font-size:19px;margin:0;}
  .sechead .sub{color:var(--mut);font-size:12.5px;}
  .sechead a{margin-left:auto;color:var(--brand);font-weight:700;font-size:13px;white-space:nowrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px;}
  .rowgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;}
  .hscroll .card{flex:0 0 186px;scroll-snap-align:start;}

  /* ---------- product card ---------- */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;min-width:0;}
  .thumb{height:150px;background:hsl(var(--h),62%,95%);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
  .thumb .em{font-size:66px;line-height:1;filter:drop-shadow(0 4px 5px rgba(0,0,0,.14));}
  .pack{width:92px;height:112px;background:#fff;border-radius:9px 9px 12px 12px;box-shadow:0 6px 14px rgba(20,28,45,.16);display:flex;flex-direction:column;align-items:center;overflow:hidden;}
  .pack i{display:block;width:100%;background:hsl(var(--h),58%,42%);color:#fff;font-style:normal;font-size:9.5px;font-weight:800;text-align:center;padding:3px 2px;white-space:nowrap;overflow:hidden;letter-spacing:.3px;}
  .pack .em{font-size:44px;margin:auto 0 0;filter:none;}
  .pack u{text-decoration:none;font-size:9px;color:#8a909c;margin:4px 0 6px;font-weight:700;}
  .tags{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
  .tag{font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 6px;color:#fff;background:var(--price);}
  .tag.new{background:#f59e0b;} .tag.org{background:#0f9d58;} .tag.own{background:#334155;}
  .vbadge{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;display:none;}
  html.vg .vbadge{display:block;}
  .cbody{padding:10px 11px 11px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .cname{font-size:13.5px;font-weight:600;line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer;margin:0;}
  .cspec{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:4px;gap:6px;}
  .price{color:var(--price);font-weight:800;font-size:19px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .price em{font-style:normal;font-size:12px;margin-right:1px;}
  .price small{font-size:12px;}
  .price s{color:#a0a6b1;font-weight:500;font-size:11.5px;margin-left:5px;}
  .addbtn{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .3s,transform .1s;flex:none;}
  .addbtn:active{transform:scale(.88);}
  .step{display:flex;align-items:center;border:1.5px solid var(--brand);border-radius:999px;height:30px;flex:none;}
  .step button{width:28px;height:27px;font-size:17px;color:var(--brand);font-weight:700;}
  .step b{min-width:20px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;}

  /* ---------- home ---------- */
  .hero{display:grid;grid-template-columns:2.2fr 1fr;gap:12px;}
  .banner{border-radius:16px;padding:30px 34px;color:#fff;position:relative;overflow:hidden;min-height:230px;display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(120deg,var(--brand-d),var(--brand) 60%,#4f8dff);transition:background .3s;}
  html.vg .banner{background:linear-gradient(120deg,#0b6a35,#12924a 60%,#48c07d);}
  .banner h1{font-size:34px;margin:0 0 8px;line-height:1.15;max-width:15em;text-wrap:balance;}
  .banner p{margin:0 0 18px;opacity:.92;font-size:15px;}
  .banner a{align-self:flex-start;background:#fff;color:var(--brand-d);font-weight:800;padding:10px 20px;border-radius:999px;}
  .banner .art{position:absolute;right:18px;bottom:-6px;font-size:86px;letter-spacing:-12px;opacity:.95;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2));pointer-events:none;}
  .sidepromo{display:grid;grid-template-rows:1fr 1fr;gap:12px;}
  .promo{border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .promo b{font-size:18px;} .promo span{font-size:12.5px;opacity:.8;margin-top:3px;}
  .promo i{position:absolute;right:12px;bottom:4px;font-size:52px;font-style:normal;}
  .promo.a{background:#fff1d6;color:#7a4a00;} .promo.b{background:#ffe3e0;color:#8b1c14;}
  .depts{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;background:#fff;border-radius:16px;padding:16px 12px;box-shadow:var(--shadow);}
  .depts a{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;text-align:center;}
  .depts a i{width:54px;height:54px;border-radius:50%;background:hsl(var(--h),62%,93%);display:flex;align-items:center;justify-content:center;font-size:28px;font-style:normal;transition:transform .15s;}
  .depts a:hover i{transform:translateY(-3px);}
  .trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .trust div{background:#fff;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:var(--shadow);}
  .trust div small{display:block;font-weight:500;color:var(--mut);font-size:11.5px;}
  .trust div i{font-style:normal;font-size:24px;}

  /* ---------- category / search ---------- */
  .crumb{font-size:12.5px;color:var(--mut);margin-bottom:10px;}
  .crumb a{color:var(--brand);}
  .cat>div{min-width:0;}
  .cat{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start;}
  .side{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:10px 0;position:sticky;top:128px;}
  .side h4{margin:6px 16px 6px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.5px;}
  .side a{display:flex;justify-content:space-between;padding:8px 16px;font-size:13.5px;}
  .side a:hover{background:var(--bg);}
  .side a.on{color:var(--brand);font-weight:800;background:var(--brand-l);}
  .side a span{color:var(--mut);font-size:11.5px;font-weight:500;}
  .side hr{border:0;border-top:1px solid var(--line);margin:8px 0;}
  .cathead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .cathead h1{font-size:22px;margin:0;}
  .cathead .n{color:var(--mut);font-size:13px;}
  .hid{background:var(--green-l);color:var(--green-d);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .tools{display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:12px;box-shadow:var(--shadow);font-size:13px;flex-wrap:wrap;}
  .tools select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff;color:var(--ink);}
  .tools label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .more{display:block;margin:18px auto 0;background:#fff;border:1.5px solid var(--brand);color:var(--brand);font-weight:800;padding:10px 34px;border-radius:999px;}
  .empty{background:#fff;border-radius:var(--r);padding:50px 20px;text-align:center;color:var(--mut);box-shadow:var(--shadow);}
  .empty i{font-size:46px;font-style:normal;display:block;margin-bottom:8px;}

  /* ---------- footer ---------- */
  footer{background:#fff;border-top:1px solid var(--line);margin-top:20px;padding:26px 0 90px;color:#4b5563;font-size:13px;}
  .fcols{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .fcols h5{margin:0 0 8px;font-size:13.5px;color:var(--ink);}
  .fcols span{display:block;margin:5px 0;}
  .disc{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);}

  /* ---------- overlays ---------- */
  .ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,20,32,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}
  .ov.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:410px;max-width:100%;background:#fff;z-index:51;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
  .drawer.show{transform:none;}
  .dhead{display:flex;align-items:center;gap:8px;padding:15px 18px;border-bottom:1px solid var(--line);font-size:17px;font-weight:800;}
  .dhead button{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--bg);font-size:18px;}
  .ship{padding:10px 18px;background:var(--warn);font-size:12.5px;}
  .ship .bar{height:6px;border-radius:999px;background:#f2e2b3;margin-top:6px;overflow:hidden;}
  .ship .bar i{display:block;height:100%;background:#f59e0b;border-radius:999px;transition:width .3s;}
  .dbody{flex:1;overflow-y:auto;padding:6px 18px;}
  .line{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;}
  .line .li{width:56px;height:56px;border-radius:10px;background:hsl(var(--h),62%,94%);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;}
  .line .ln{flex:1;min-width:0;}
  .line .ln b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .line .ln span{font-size:12px;color:var(--mut);}
  .line .nv{display:inline-block;background:#fde8e6;color:#b3261e;border-radius:5px;font-size:10.5px;font-weight:800;padding:1px 6px;margin-left:6px;}
  .line .lp{color:var(--price);font-weight:800;font-variant-numeric:tabular-nums;display:block;margin-top:2px;font-size:13.5px;}
  .dfoot{border-top:1px solid var(--line);padding:14px 18px 18px;}
  .sum{display:flex;justify-content:space-between;margin:4px 0;font-size:13px;color:#4b5563;}
  .sum.t{font-size:16px;font-weight:800;color:var(--ink);margin-top:8px;}
  .sum.t b{color:var(--price);font-size:20px;}
  .cta{display:block;width:100%;background:var(--brand);color:#fff;font-weight:800;font-size:15.5px;padding:13px;border-radius:12px;margin-top:12px;transition:background .3s;text-align:center;}
  .cta:disabled{background:#c5cad3;cursor:not-allowed;}
  .cta.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.25s;z-index:52;background:#fff;border-radius:18px;
    width:780px;max-width:calc(100% - 24px);max-height:calc(100% - 40px);overflow-y:auto;}
  .modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
  .modal .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:18px;z-index:2;}
  .pd{display:grid;grid-template-columns:300px 1fr;}
  .pd .pimg{background:hsl(var(--h),62%,95%);display:flex;align-items:center;justify-content:center;min-height:320px;border-radius:18px 0 0 18px;}
  .pd .pimg .em{font-size:130px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.16));}
  .pd .pimg .pack{transform:scale(1.9);}
  .pd .pimg .pack .em{font-size:44px;filter:none;}
  .pinfo{padding:26px 26px 22px;}
  .pinfo .br{color:var(--brand);font-weight:800;font-size:12.5px;letter-spacing:.3px;}
  .pinfo h2{margin:4px 0 6px;font-size:21px;line-height:1.3;padding-right:30px;}
  .pinfo .meta{color:var(--mut);font-size:12.5px;margin-bottom:12px;}
  .pinfo .price{font-size:30px;}
  .pinfo .price em{font-size:16px;} .pinfo .price small{font-size:17px;} .pinfo .price s{font-size:13px;}
  .vok{display:none;margin:12px 0 0;background:var(--green-l);color:var(--green-d);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;}
  html.vg .vok{display:block;}
  .pinfo dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;}
  .pinfo dt{color:var(--mut);white-space:nowrap;}
  .pinfo dd{margin:0;}
  .pinfo .buy{display:flex;align-items:center;gap:12px;margin-top:18px;}
  .pinfo .buy .step{height:40px;} .pinfo .buy .step button{width:38px;height:36px;font-size:20px;} .pinfo .buy .step b{min-width:30px;font-size:15px;}
  .pinfo .buy .cta{margin:0;flex:1;}
  .co{padding:24px 26px;}
  .co h2{margin:0 0 14px;font-size:20px;}
  .co .box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;}
  .co .box b{display:block;margin-bottom:3px;}
  .co .pay{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .co .pay span{border:1.5px solid var(--line);border-radius:9px;padding:6px 12px;font-weight:700;}
  .co .pay span.on{border-color:var(--brand);color:var(--brand);background:var(--brand-l);}
  .co .demo{background:var(--warn);border-radius:10px;padding:9px 12px;font-size:12.5px;margin:10px 0;}
  .okmark{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:6px auto 12px;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;z-index:51;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .28s;max-height:80%;overflow-y:auto;padding:8px 0 18px;}
  .sheet.show{transform:none;}
  .sheet h3{margin:10px 18px 8px;font-size:16px;}
  .sheet a{display:flex;align-items:center;gap:12px;padding:12px 18px;font-weight:600;border-top:1px solid var(--line);}
  .sheet a i{font-style:normal;font-size:22px;}
  .sheet a span{margin-left:auto;color:var(--mut);font-size:12px;font-weight:500;}
  .toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,16px);background:rgba(20,24,34,.94);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .tabbar{display:none;}
  .mveg{display:none;}

  /* ---------- responsive ---------- */
  @media (max-width:1100px){ .rowgrid{grid-template-columns:repeat(4,1fr);} .rowgrid .card:nth-child(n+5){display:none;} .depts{grid-template-columns:repeat(6,1fr);row-gap:14px;} .loc{display:none;} }
  @media (max-width:760px){
    body{font-size:13.5px;padding-bottom:58px;}
    .wrap{padding:0 10px;}
    .strip{display:none;}
    .hrow{flex-wrap:wrap;gap:8px 10px;padding-top:8px;padding-bottom:8px;}
    .logo .mark{width:32px;height:32px;border-radius:9px;} .logo b{font-size:18px;} .logo small{display:none;}
    .hact{margin-left:auto;} .hact .login,.cartbtn{display:none;}
    .hrow .vegan{display:none;}
    .search{order:5;flex:1 1 100%;} .search input{padding:8px 11px;} .search button span{display:none;} .search button{padding:0 14px;}

  $('#modal').innerHTML='<button class="x" data-act="closeall" aria-label="close">✕</button><div class="pd"><div class="pimg" style="--h:'+p.s.hue+'">'+visual(p)+'</div><div class="pinfo">'+
    '<div class="br">'+esc(lang==='zh'?p.br[0]:p.br[1])+' · '+L(p.d)+' › '+L(p.s)+'</div><h2>'+esc(pname(p))+'</h2>'+
    '<div class="meta">★ '+p.rate+' · '+t('sold')(p.sold)+'</div>'+priceH(p)+
    (p.v?'<div class="vok">'+t('vok')+'</div>':'')+
    '<dl><dt>'+t('ing')+'</dt><dd>'+esc(ingOf(p))+'</dd><dt>'+t('spec')+'</dt><dd>'+esc(sizeT(p.size))+'</dd><dt>'+t('origin')+'</dt><dd>'+t('originV')[p.h%8]+'</dd><dt>'+t('store')+'</dt><dd>'+t('storeV')[p.d.k]+'</dd><dt>'+t('life')+'</dt><dd>'+t('lifeV')[p.d.k]+'</dd></dl>'+
    '<div class="buy"><span data-ctl="'+id+'">'+ctl(id)+'</span><button class="cta" data-act="inc" data-id="'+id+'" data-toast="1">'+t('add')+'</button></div></div></div>';
  $('#cart').classList.remove('show');$('#modal').classList.add('show');$('#ov').classList.add('show');
}
function checkout(){
  var tt=totals();
  $('#modal').innerHTML='<button class="x" data-act="closeall" aria-label="close">✕</button><div class="co"><h2>'+t('coT')+'</h2>'+
   '<div class="box"><b>'+t('addr')+'</b>'+t('addrV')+'</div><div class="box"><b>'+t('time')+'</b>'+t('timeV')+'</div>'+
   '<div class="box"><b>'+t('pay')+'</b><div class="pay"><span class="on">'+t('wx')+'</span><span>'+t('ali')+'</span><span>'+t('card')+'</span></div></div>'+
   '<div class="sum"><span>'+t('subtotal')+' ('+tt.n+')</span><span>¥'+tt.sub.toFixed(2)+'</span></div><div class="sum"><span>'+t('ship')+'</span><span>'+(tt.ship?'¥'+tt.ship.toFixed(2):t('free'))+'</span></div><div class="sum t"><span>'+t('total')+'</span><b>¥'+tt.total.toFixed(2)+'</b></div>'+
   '<div class="demo">'+t('demo')+'</div><button class="cta" data-act="submit">'+t('submit')+'</button></div>';
  $('#cart').classList.remove('show');$('#modal').classList.add('show');$('#ov').classList.add('show');
}
function submitOrder(){
  cart={};save();badge();
  $('#modal').innerHTML='<div class="co" style="text-align:center"><div class="okmark">✓</div><h2>'+t('okT')+'</h2><p style="color:var(--mut);margin:0 0 6px">'+t('okP')+'</p><button class="cta" data-act="closeall">'+t('back')+'</button></div>';
  route();
}
function openSheet(){
  $('#sheet').innerHTML='<h3>'+t('cats')+'</h3>'+DEPTS.map(function(d){return '<a href="#/c/'+d.k+'" data-act="closeall"><i>'+d.e+'</i>'+L(d)+'<span>'+count(PRODUCTS.filter(function(p){return p.d===d;}))+'</span></a>';}).join('');
  $('#sheet').classList.add('show');$('#ov').classList.add('show');
}
function setVegan(on){vegan=on;document.documentElement.classList.toggle('vg',on);chrome();route();if($('#cart').classList.contains('show'))renderCart();}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='inc'){setQty(id,(cart[id]||0)+1);if(el.dataset.toast||!cart[id]||cart[id]===1)toast(t('added')(pname(PRODUCTS[id])));}
  else if(a==='dec')setQty(id,(cart[id]||0)-1);
  else if(a==='open')openProduct(id);
  else if(a==='cart')openCart();
  else if(a==='closeall')closeAll();
  else if(a==='vegan')setVegan(!vegan);
  else if(a==='lang'){lang=lang==='zh'?'en':'zh';chrome();route();closeAll();}
  else if(a==='more'){limit+=40;route();}
  else if(a==='checkout')checkout();
  else if(a==='submit')submitOrder();
  else if(a==='sheet')openSheet();
  else if(a==='gohome'){location.hash='#/';closeAll();}
  else if(a==='demo')toast(t('demoToast'));
});
document.addEventListener('change',function(e){
  if(e.target.id==='sortSel'){sort=e.target.value;route();}
  if(e.target.id==='dealChk'){onlyDeal=e.target.checked;limit=40;route();}
});
$('#searchForm').addEventListener('submit',function(e){e.preventDefault();var v=$('#q').value.trim();location.hash=v?'#/s/'+encodeURIComponent(v):'#/';$('#q').blur();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();});
window.addEventListener('hashchange',function(){closeAll();route();});

/* ---------- init ---------- */
(function(){
  var qs=new URLSearchParams(location.search);
  if(/^(zh|cn|chinese)$/i.test(qs.get('lang')||''))lang='zh';
  try{var c=JSON.parse(localStorage.getItem('hx_cart')||'{}');for(var k in c)if(PRODUCTS[k]&&c[k]>0)cart[k]=c[k];}catch(e){}
  chrome();
  if(qs.get('vegan')==='1')setVegan(true);else route();
})();
</script>
</body>
</html>
